<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Neural pathway visualization</title><desc id="desc">An animated row of connected neural nodes representing iterative learning.</desc>
  <defs><linearGradient id="line" x1="0" x2="1"><stop stop-color="#183449"/><stop offset=".5" stop-color="#51defb"/><stop offset="1" stop-color="#183449"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="3"/></filter><style>.base{stroke:url(#line);stroke-width:1.5;fill:none}.signal{stroke:#a3f5ff;stroke-width:2;stroke-dasharray:4 35;animation:signal 8s linear infinite}.n{fill:#63e5ff}.h{fill:#63e5ff;filter:url(#g);opacity:.65;animation:breathe 3s ease-in-out infinite alternate}@keyframes signal{to{stroke-dashoffset:-160}}@keyframes breathe{to{opacity:.18;transform:scale(1.7)}}@media (prefers-reduced-motion:reduce){.signal,.h{animation:none}}</style></defs>
  <rect width="1200" height="180" rx="14" fill="#030b14"/><g class="base"><path d="M90 90 240 45 390 112 530 58 670 115 820 46 970 103 1110 70"/><path d="M90 90 240 132 390 112 530 142 670 115 820 135 970 103 1110 120"/><path d="M240 45 390 112 530 58 670 115 820 46 970 103"/></g><g class="signal"><path d="M90 90 240 45 390 112 530 58 670 115 820 46 970 103 1110 70"/><path d="M90 90 240 132 390 112 530 142 670 115 820 135 970 103 1110 120"/></g><g class="h"><circle cx="90" cy="90" r="12"/><circle cx="240" cy="45" r="12"/><circle cx="390" cy="112" r="12"/><circle cx="530" cy="58" r="12"/><circle cx="670" cy="115" r="12"/><circle cx="820" cy="46" r="12"/><circle cx="970" cy="103" r="12"/><circle cx="1110" cy="70" r="12"/></g><g class="n"><circle cx="90" cy="90" r="4"/><circle cx="240" cy="45" r="4"/><circle cx="240" cy="132" r="4"/><circle cx="390" cy="112" r="5"/><circle cx="530" cy="58" r="4"/><circle cx="530" cy="142" r="4"/><circle cx="670" cy="115" r="5"/><circle cx="820" cy="46" r="4"/><circle cx="820" cy="135" r="4"/><circle cx="970" cy="103" r="5"/><circle cx="1110" cy="70" r="4"/><circle cx="1110" cy="120" r="4"/></g>
</svg>
