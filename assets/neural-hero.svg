<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Ajit Bhandekar neural systems banner</title><desc id="desc">A dark neural network with animated signals and the text Ajit Bhandekar, learning systems into useful products.</desc>
