    <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
    <style>.wire{stroke:#36d9ff;stroke-opacity:.34;stroke-width:1.4;fill:none}.node{fill:#9bf2ff;filter:url(#soft)}.dot{fill:#e1fbff}.pulse{fill:none;stroke:#9bf2ff;stroke-width:1.3;stroke-dasharray:7 20;animation:flow 7s linear infinite}.orbit{transform-origin:910px 176px;animation:orbit 18s linear infinite}@keyframes flow{to{stroke-dashoffset:-108}}@keyframes orbit{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.pulse,.orbit{animation:none}}</style>
