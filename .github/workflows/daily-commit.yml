name: Daily Auto Commit

on:
  schedule:
    # Runs every day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  # Allows you to manually trigger it anytime from the Actions tab
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Activity Log
        run: |
          echo "Automated update: $(date)" >> activity_log.txt

      - name: Commit and Push Changes
        run: |
          git config --global user.name "ajit-110920"
          git config --global user.email "ajitbhandekar110920@gmail.com"
          git add activity_log.txt
          git commit -m "chore: automated daily activity update"
          git push
